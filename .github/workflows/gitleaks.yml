name: Secret scanning

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || !github.event.deleted
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan Git history
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            log_options=--all
          else
            log_options="${BASE_SHA}..HEAD"
          fi
          report="$RUNNER_TEMP/gitleaks.json"
          status=0
          "$RUNNER_TEMP/gitleaks" git --redact=100 --report-path="$report" \
            --log-opts="--diff-merges=first-parent $log_options" . || status=$?
          if [[ -s "$report" ]]; then
            jq -c '.[] | {RuleID, File, StartLine, Commit}' "$report"
          fi
          exit "$status"
