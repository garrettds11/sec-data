name: Dependency scanning

on:
  push:
  pull_request:
  schedule:
    - cron: '41 11 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv-scanner:
    name: OSV-Scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install OSV-Scanner
        shell: bash
        run: |
          scanner="$RUNNER_TEMP/osv-scanner"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64 \
            --output "$scanner"
          printf '%s  %s\n' fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8 "$scanner" | sha256sum --check
          chmod +x "$scanner"
      - name: Scan AWS uploader dependencies
        run: '"$RUNNER_TEMP/osv-scanner" scan source --lockfile=requirements.txt:./requirements-aws.txt'
