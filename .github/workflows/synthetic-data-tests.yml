name: Synthetic data generator tests
on:
  push:
  pull_request:
jobs:
  tests:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.15']
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Interpreter version
        run: python --version
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compliance dry run
        run: python create_compliance_table.py --dry-run --seed 2 --as-of 2024-11-12T08:00:00Z
      - name: Vulnerability dry run compatibility
        run: python create_vuln_table.py --dry-run --seed 2 --as-of 2024-11-12T08:00:00Z
      - name: Run Black Basta scenario smoke test (Windows)
        if: matrix.os == 'windows-latest' && matrix.python == '3.15'
        shell: pwsh
        run: ./tests/smoke-black-basta.ps1
