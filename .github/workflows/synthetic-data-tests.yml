name: Synthetic data generator tests
on:
  push:
  pull_request:
jobs:
  tests:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.15']
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Interpreter version
        run: python --version
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compliance dry run
        run: python create_compliance_table.py --dry-run --seed 2 --as-of 2024-11-12T08:00:00Z
      - name: Vulnerability dry run compatibility
        run: python create_vuln_table.py --dry-run --seed 2 --as-of 2024-11-12T08:00:00Z
      - name: Run documented Black Basta walkthrough (Windows)
        if: matrix.os == 'windows-latest' && matrix.python == '3.15'
        shell: pwsh
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw 'Could not create smoke-test environment.' }
          $guide = Get-Content -LiteralPath 'docs/getting-started.md' -Raw
          $blocks = [regex]::Matches($guide, '(?ms)^```powershell\r?\n(.*?)^```')
          $generation = @($blocks | Where-Object { $_.Groups[1].Value.Contains('$coverageFile =') })
          if ($generation.Count -ne 1) { throw 'Expected one complete documented generation block.' }
          & ([scriptblock]::Create($generation[0].Groups[1].Value))
