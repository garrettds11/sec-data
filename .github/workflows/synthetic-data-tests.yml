name: Synthetic data generator tests
on:
  push:
  pull_request:
jobs:
  tests:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.15']
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Interpreter version
        run: python --version
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compliance dry run
        run: python create_compliance_table.py --dry-run --seed 2 --as-of 2024-11-12T08:00:00Z
      - name: Vulnerability dry run compatibility
        run: python create_vuln_table.py --dry-run --seed 2 --as-of 2024-11-12T08:00:00Z
